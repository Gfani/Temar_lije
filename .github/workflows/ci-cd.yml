name: Temar Lije CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - Fani
  pull_request:
    branches:
      - main
      - master
      - Fani

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Run Automated Tests & Code Quality Checks
  # ============================================================================
  test:
    name: Run Automated Tests (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./Backend
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Run Backend Unit & Integration Tests
        working-directory: ./Backend
        run: npm test

  # ============================================================================
  # Job 2: Build & Push Container Image to Docker Hub
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials Availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::Docker Hub secrets not detected. Skipping push; performing validation build only."
          fi

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.has_secrets == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/temar_backend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
            type=ref,event=branch

      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: ${{ steps.check-secrets.outputs.has_secrets == 'true' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
